[package]
name = "zoro-player"
version = "1.0.1"
description = "Zoro Player - a Persian RTL music player with EQ, visualizer and desktop widget"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
lofty = "0.22"
symphonia = { version = "0.5", features = ["all"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify-debouncer-mini = "0.5"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
